# Ajoute un accès HTTPS (Caddy, certificat Let's Encrypt automatique) à
# l'interface ChirpStack du dépôt officiel chirpstack-docker. À copier à
# côté de son docker-compose.yml (voir README.md, étape 2).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - chirpstack

volumes:
  caddy-data:
  caddy-config:
